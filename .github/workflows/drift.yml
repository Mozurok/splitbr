name: drift
on:
  schedule:
    # Segundas 12:00 UTC = 09:00 America/Sao_Paulo (mesma cadencia da rotina)
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["vendor/**", "scripts/drift-check.mjs", ".github/workflows/drift.yml"]
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comparar contratos hospedados vs vendorados (conteudo normalizado)
        id: check
        run: node scripts/drift-check.mjs
      # So drift e indisponibilidade de alvo produtivo viram issue. Um
      # setup-error (arquivo vendorado ausente ou ilegivel) reprova o run mas
      # NAO abre issue rotulada como drift: o problema e nosso, nao do contrato.
      - name: Abrir issue em caso de divergencia
        if: always() && (steps.check.outputs.status == 'drift' || steps.check.outputs.status == 'unreachable' || steps.check.outputs.status == 'malformed' || steps.check.outputs.status == 'informational')
        uses: actions/github-script@v7
        env:
          DRIFT_STATUS: ${{ steps.check.outputs.status }}
        with:
          script: |
            // Titulo estavel, sem data: o cron semanal reabriria uma issue nova
            // toda segunda para a mesma divergencia nao resolvida.
            // Dois titulos: um bloqueante (alvo de producao) e um informativo
            // (so o piloto divergiu). O informativo existe porque D-2 manda
            // relatar a divergencia do piloto sem reprovar o run; sem issue,
            // "relatar" viraria uma linha de log num check verde.
            const status = process.env.DRIFT_STATUS;
            const informativo = status === "informational";
            const titulo = informativo
              ? "Piloto divergiu do contrato vendorado (informativo)"
              : "Drift detectado nos contratos oficiais";
            const dia = new Date().toISOString().slice(0, 10);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existentes = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "drift",
            });
            const aberta = existentes.data.find(i => i.title === titulo);
            if (aberta) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: aberta.number,
                body: `Ainda divergente em ${dia} (status: ${status}). Run: ${run}`,
              });
              return;
            }
            const corpo = informativo
              ? [
                  `O contrato do piloto divergiu do vendorado (${dia}). O run passou de propósito: o piloto é infraestrutura de teste com janela até 31/12/2026 e mudar antes da produção é o comportamento esperado dele, então isso é aviso, não quebra.`,
                  "",
                  `Run: ${run} (o log lista os caminhos das chaves que mudaram)`,
                  "",
                  "Vale olhar porque o piloto é o canal de antecipação de mudança: o que aparece nele hoje tende a chegar na produção depois. Se a divergência for relevante, re-vendorar com nova linha no vendor/MANIFEST.md.",
                ].join("\n")
              : [
                  `O workflow semanal encontrou divergência em um contrato oficial de produção (status: ${status}, ${dia}).`,
                  "",
                  `Run: ${run} (o log lista o alvo e os caminhos das chaves que mudaram)`,
                  "",
                  "Próximo passo: re-vendorar o artefato com nova linha no vendor/MANIFEST.md (nunca sobrescrever em silêncio) e avaliar impacto em @splitbr/client e @splitbr/mock.",
                ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ["drift"],
              body: corpo,
            });
